<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Продакт на языке твоей профессии</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  :root{--bg:#0f1117;--card:#1a1d2e;--card2:#1e2235;--line:#2d3148;--ink:#e2e8f0;--soft:#94a3b8;--mute:#64748b;
    --pp:#7c3aed;--pp2:#a78bfa;--ppd:#6d28d9;--gr:#4ade80;--grd:#16a34a;--am:#f59e0b;--bl:#38bdf8;--mg:#e879f9}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,sans-serif;background:var(--bg);color:var(--ink);
    min-height:100vh;display:flex;flex-direction:column}
  button{font-family:inherit;cursor:pointer;border:none}
  .wrap{width:100%;max-width:620px;margin:0 auto;padding:0 16px;flex:1;display:flex;flex-direction:column}

  .top{display:flex;align-items:center;gap:12px;padding:16px 0 10px}
  .top .x{width:32px;height:32px;border-radius:9px;background:var(--card);border:1px solid var(--line);color:var(--mute);font-size:17px;display:grid;place-items:center}
  .bar{flex:1;height:12px;border-radius:99px;background:var(--line);overflow:hidden}
  .bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--pp),var(--mg));border-radius:99px;transition:width .4s cubic-bezier(.4,1.3,.5,1)}
  .step-n{font-size:12px;font-weight:800;color:var(--mute);min-width:38px;text-align:right}

  /* HOME */
  .home{flex:1;display:flex;flex-direction:column;justify-content:center;padding:26px 0 30px;animation:in .3s ease}
  .home h1{font-size:27px;line-height:1.25;letter-spacing:-.5px;margin-bottom:12px}
  .home h1 .g{background:linear-gradient(90deg,var(--pp2),var(--mg));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  .home>p{font-size:15.5px;line-height:1.65;color:var(--soft);margin-bottom:26px}
  .pick-q{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;color:var(--mute);margin-bottom:12px}
  .picks{display:flex;flex-direction:column;gap:11px}
  .pick{display:flex;align-items:center;gap:14px;background:var(--card);border:1.5px solid var(--line);border-radius:15px;
    padding:15px 16px;text-align:left;transition:transform .12s,border-color .15s,background .15s}
  .pick:hover{border-color:#4c4f6b;transform:translateY(-2px)}
  .pick:active{transform:scale(.99)}
  .pick .em{width:46px;height:46px;border-radius:12px;background:#0d1017;border:1px solid var(--line);display:grid;place-items:center;font-size:24px;flex:none}
  .pick .tt{flex:1;min-width:0}
  .pick .nm{display:block;font-size:16.5px;font-weight:700;color:var(--ink);margin-bottom:3px}
  .pick .tg{display:block;font-size:13px;color:var(--soft);line-height:1.35}
  .pick .ar{color:var(--mute);font-size:20px;flex:none}
  .pick-other{border-style:dashed;background:transparent}
  .other-in{width:100%;min-height:54px;background:var(--card);border:1.5px solid var(--line);border-radius:13px;padding:14px 16px;color:var(--ink);font-size:16px;margin:6px 0 12px;font-family:inherit}
  .other-in:focus{outline:none;border-color:var(--pp2)}
  .other-in::placeholder{color:var(--mute)}
  .home .fine{font-size:12px;color:var(--mute);text-align:center;margin-top:22px;line-height:1.5}

  .stage{flex:1;display:flex;flex-direction:column;padding:8px 0 0;animation:in .28s ease}
  @keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .who{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;
    padding:4px 10px;border-radius:20px;margin-bottom:12px;width:fit-content}
  .who.hr{background:#0c4a6e44;color:#7dd3fc;border:1px solid #075985}
  .who.pm{background:#7c3aed22;color:var(--pp2);border:1px solid #3730a3}
  .who.both{background:#4a044e33;color:#f5d0fe;border:1px solid #86198f}
  h2{font-size:22px;line-height:1.28;letter-spacing:-.3px;margin-bottom:12px}
  p{font-size:15.5px;line-height:1.7;color:var(--soft);margin-bottom:12px}
  p strong,li strong{color:var(--ink)}
  .funnel{background:#0d1017;border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:14px 0;font-family:'SF Mono',ui-monospace,Menlo,monospace;font-size:12.5px;line-height:1.9;color:#a5f3fc;white-space:pre;overflow-x:auto}
  .box{border-radius:10px;padding:13px 15px;margin:14px 0;border:1px solid;border-left-width:3px;font-size:14px;line-height:1.6}
  .box .bl{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px}
  .ins{background:#1e1b4b22;border-color:#3730a3;border-left-color:var(--pp)}.ins .bl{color:var(--pp2)}.ins p{color:#c4b5fd;margin:0}
  .warn{background:#451a0322;border-color:#92400e;border-left-color:var(--am)}.warn .bl{color:var(--am)}.warn p{color:#fcd34d;margin:0}
  .tool{background:#052e1622;border-color:#166534;border-left-color:var(--gr)}.tool .bl{color:var(--gr)}.tool p{color:#86efac;margin:0}
  table{width:100%;border-collapse:collapse;font-size:13px;margin:12px 0}
  th{padding:8px 10px;text-align:left;color:var(--mute);font-size:11px;text-transform:uppercase;border-bottom:1px solid var(--line)}
  td{padding:8px 10px;color:#cbd5e1;border-bottom:1px solid var(--card2)}
  tr.hot td{color:var(--mg);font-weight:700}

  .opts{display:flex;flex-direction:column;gap:10px;margin-top:6px}
  .opt{display:flex;align-items:center;gap:12px;min-height:56px;background:var(--card);border:1.5px solid var(--line);border-radius:13px;
    padding:14px 16px;font-size:15px;color:var(--ink);text-align:left;transition:transform .12s,border-color .15s,background .15s}
  .opt:hover{border-color:#4c4f6b;transform:translateY(-1px)}
  .opt:active{transform:scale(.99)}
  .opt .k{width:26px;height:26px;border-radius:8px;border:1.5px solid var(--line);display:grid;place-items:center;font-size:12px;font-weight:800;color:var(--mute);flex:none}
  .opt.right{border-color:var(--gr);background:#052e1633;animation:pop .32s cubic-bezier(.3,1.5,.5,1)}.opt.right .k{border-color:var(--gr);color:var(--gr)}
  .opt.wrong{border-color:#6b5563;background:#2a1f2a55;opacity:.75}
  @keyframes pop{40%{transform:scale(1.02)}}

  .foot{position:sticky;bottom:0;background:linear-gradient(180deg,rgba(15,17,23,0),var(--bg) 30%);padding:14px 0 20px;margin-top:16px}
  .verdict{border-radius:12px;padding:13px 15px;margin-bottom:11px;font-size:14px;line-height:1.6;display:none;animation:in .25s}
  .verdict.show{display:block}
  .verdict.ok{background:#052e1633;color:#86efac;border:1px solid #166534}
  .verdict.no{background:#3a200a33;color:#fcd34d;border:1px solid #7c5410}
  .btn{width:100%;min-height:54px;border-radius:14px;font-size:16px;font-weight:800;color:#fff;background:linear-gradient(135deg,var(--pp),var(--ppd));box-shadow:0 5px 0 #4c1d95;transition:.08s}
  .btn:active{transform:translateY(3px);box-shadow:0 2px 0 #4c1d95}
  .btn.ok{background:linear-gradient(135deg,var(--gr),var(--grd));box-shadow:0 5px 0 #14532d;color:#06281a}
  .btn[disabled]{background:#2d3148;box-shadow:0 5px 0 #22253a;color:var(--mute);cursor:not-allowed}
  .btn2{width:100%;min-height:50px;border-radius:14px;font-size:15px;font-weight:700;color:var(--pp2);background:var(--card);border:1.5px solid var(--line);margin-top:10px}
  .btn2:active{transform:translateY(2px)}

  .done{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px 0}
  .done .big{font-size:66px;animation:pop2 .5s cubic-bezier(.3,1.6,.5,1)}
  @keyframes pop2{from{transform:scale(0)}}
  .done h2{margin:8px 0 4px}
  .done p{margin-bottom:18px}
  .recap{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;text-align:left;width:100%;margin-bottom:16px}
  .recap div{font-size:14px;color:var(--soft);padding:7px 0 7px 24px;position:relative;border-bottom:1px solid var(--line)}
  .recap div:last-child{border-bottom:none}
  .recap div::before{content:'✓';position:absolute;left:2px;color:var(--gr);font-weight:800}
  .recap .h{color:var(--pp2);font-weight:800;font-size:11px;text-transform:uppercase;letter-spacing:.5px;padding:12px 0 4px;border-bottom:none}
  .recap .h::before{content:''}
  .recap .h:first-child{padding-top:0}
  .recap .sk{padding-left:24px}
  .recap .sk::before{content:'→';color:var(--bl)}
  .ddv-final{background:linear-gradient(135deg,#1e1b4b,#2a1a4b);border:1px solid #3730a3;border-radius:14px;padding:16px 18px;margin-bottom:16px;width:100%}
  .ddv-final .t{font-size:13px;color:#c4b5fd;line-height:1.6;text-align:center}
  .ddv-final .t b{color:#f5d0fe}
  .note{font-size:12px;color:var(--mute);text-align:center;padding:10px 0 24px;line-height:1.5}
  .survey{width:100%;background:var(--card);border:1px solid #3730a3;border-radius:14px;padding:16px 16px 15px;margin:2px 0 14px;text-align:left}
  .sv-q{font-size:15.5px;font-weight:700;color:var(--ink);line-height:1.4;margin-bottom:13px;text-align:center}
  .sv-cta{display:flex;flex-direction:column;gap:10px}
  .sv-opts{display:flex;flex-direction:column;gap:8px}
  .sv-o{width:100%;min-height:46px;border-radius:11px;background:var(--card2);border:1.5px solid var(--line);color:var(--ink);font-size:14.5px;padding:10px 14px;text-align:left;transition:transform .12s,border-color .15s}
  .sv-o:hover{border-color:#4c4f6b}.sv-o:active{transform:scale(.99)}
  .sv-done{font-size:16px;color:#86efac;line-height:1.5;text-align:center;padding:4px 2px}
  .sv-done b{color:#c4b5fd}
  .sv-done .em{font-size:44px;display:block;margin-bottom:6px}
  .sv-goal{background:#0d1017;border:1px solid #3730a3;border-radius:12px;padding:13px 15px;margin:0 0 14px;text-align:center}
  .sv-goal .lbl{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--mute);margin-bottom:5px}
  .sv-goal .role{font-size:18px;font-weight:800;color:var(--pp2);margin-bottom:5px}
  .sv-goal .why{font-size:13.5px;color:#c4b5fd;line-height:1.5}
  .sv-note{font-size:14px;color:var(--soft);line-height:1.55;margin-top:10px}
  .sv-note b{color:var(--ink)}
</style>
</head>

</div>
<div class="note" id="note"></div>

/* ================= КОНТЕНТ-ПАКИ ПО ПРОФЕССИЯМ ================= */
const CASES = {

/* ============ РЕКРУТЕР ============ */
recruiter:{
 name:'Рекрутер', em:'🧲', tag:'воронка найма → продакт в HR-tech',
 goal:{role:'продакт в HR-tech', why:'Ты понимаешь рекрутера изнутри — этого нет у обычного джуна-PM'},
 credit:'<span style="color:#7dd3fc">HR-консультант</span> — реалии найма · <span style="color:#a78bfa">Продуктовый эксперт</span> — механика',
 steps:[
 {type:'info', who:'hr', label:'Реалии найма',
  h:'Продакта сократили. Помочь просят тебя',
  body:`<p>Ты рекрутер в продуктовой компании. Продакта, который вёл внутренние HR-инструменты, сократили. Приходит директор: «Ты знаешь найм лучше всех — помоги, у нас найм еле шевелится».</p>
  <p>Открываешь свои цифры за месяц по потоку Java-вакансий:</p>
  <div class="funnel">600  профилей пересмотрено в сорсинге
 90  откликнулись
 30  прошли скрининг резюме

  <p>Знакомое ощущение: сверху толпа, снизу двое. И заказчик спрашивает, почему так долго.</p>`},
 {type:'quiz', who:'pm', label:'Продуктовая механика',
  h:'С чего начнёшь?',
  opts:['Сразу автоматизировать сорсинг — на него уходит больше всего времени','Понять, где именно теряем и сколько это стоит','Попросить нанять ещё одного рекрутера'],
  answer:1,
  ok:'Да. Сначала выяснить, где теряем, потом чинить. Иначе автоматизируешь то, что и так работает.',
  no:'Логично, но рано. Пока не знаешь, где теряешь, автоматизация и найм людей — стрельба вслепую. Сначала — где потеря.'},
 {type:'info', who:'pm', label:'Продуктовая механика',
  h:'Это и есть discovery',
  body:`<p>То, что ты выбираешь — «сначала пойму, где теряем» — называется <strong>discovery</strong>: сначала найти проблему, потом решать.</p>
  <p>А твоя табличка — это <strong>воронка</strong>, и каждый переход в ней — <strong>конверсия</strong>. Ты считаешь конверсии годами, только под именем «процент прошедших скрининг».</p>
  <div class="box ins"><div class="bl">Мостик</div><p>Продуктовые термины ты уже проживаешь на практике. Дальше — как они работают по-настоящему.</p></div>`},
 {type:'info', who:'pm', label:'Продуктовая механика',
  h:'Считаем — а рвётся ли вообще?',
  body:`<table>
  <tr><th>Переход</th><th>Числа</th><th>Конверсия</th></tr>

  <p>Смотрим снизу — и там всё в порядке. <strong>67% выходят с оффера — это норма</strong> (обычно 70–90%). Скрининг и интервью в рынке, 15% отклика на холодный сорсинг — нормально. <strong>Дыры нет.</strong></p>
  <div class="box ins"><div class="bl">Вот это и есть открытие</div><p>Раз воронка здорова, проблема не в конверсиях. Она в том, <strong>сколько тебе стоит её верх</strong>: пересмотреть 600 профилей и каждому написать — это 40+ часов в месяц. Твоих.</p></div>
  <div class="box warn"><div class="bl">Важный ход</div><p>Сначала проверь, есть ли дыра. <strong>Нет дыры — не выдумывай.</strong> Боль бывает не в конверсии, а в цене — и это другая задача.</p></div>`},
 {type:'quiz', who:'pm', label:'Продуктовая механика',
  h:'Идея: инструмент, который ловит кандидатов — сам находит подходящих и пишет им первым. Где он играет в воронке?',

 {type:'info', who:'both', label:'HR + Продукт вместе',
  h:'Где заканчивается инструмент и начинается человек',
  body:`<p>Инструмент ловит кандидатов. А дожимает — рекрутер: разговором, силой бренда, работой с сомнениями. И когда работодатель кандидата выкатывает контроффер — отбивает его. Это <strong>не автоматизируется</strong>: оффер про доверие и эмоцию, а не про фильтр.</p>
  <div class="box tool"><div class="bl">Твой ход</div><p>Ты проводишь границу: вот это делает продукт, вот это — человек. Это продуктовое решение о границах — одно из самых взрослых, что делает PM.</p></div>
  <p>Автоматизация окупается там, где много рутины. Пересмотреть 600 профилей и написать каждому первое сообщение — рутина, её не жалко машине. Разговор с сомневающимся кандидатом — не рутина, отдавать нельзя.</p>
  <div class="box warn"><div class="bl">Граница честности</div><p>«ИИ сам наймёт» — не бывает. Инструмент экономит часы, а не заменяет доверие.</p></div>`},

  opts:['Кандидатов «поймали» больше, чем раньше','Часы на поиск упали, а качество пойманных не просело','Директор доволен и хвалит'],
  answer:1,
  ok:'Точно. Сэкономленные часы без падения качества — вот польза. А «больше кандидатов» может и навредить: мусора больше, разгребать дольше.',
  no:'Не совсем. «Больше кандидатов» и «начальник доволен» — красивые, но пустые цифры. Смотри на сэкономленные часы И на то, не просела ли воронка ниже.'},
 {type:'info', who:'both', label:'HR + Продукт вместе',
  h:'Всё это — деньги, и в твоём мире тоже',
  body:`<p>В найме польза считается так: <strong>часы рекрутера</strong> + <strong>стоимость найма</strong> + <strong>время закрытия вакансии</strong>. Сэкономить 40 часов в месяц на поиске и первых письмах — это реальные деньги компании.</p>

 {type:'info', who:'both', label:'HR + Продукт вместе',
  h:'Это называется приоритизация. И ты в ней давно',

 {type:'info', who:'pm', label:'Продуктовая механика',
  h:'Перед запуском — сформулируй ставку',
  body:`<p>Прежде чем строить, продакт вслух проговаривает, на что ставит. Не «сделаем и посмотрим», а <strong>гипотеза</strong> — проверяемая ставка:</p>
  <div class="box ins"><div class="bl">Твоя гипотеза</div><p><b>Если</b> инструмент сам найдёт подходящих и напишет им первым,<br><b>то</b> я сэкономлю ~40 часов в месяц на поиске и вакансии закроются быстрее,<br><b>потому что</b> сейчас мои часы уходят на перебор профилей, а не на людей.</p></div>

 {type:'quiz', who:'pm', label:'Аналитика',
  h:'Запустили. Через месяц инструмент дотянулся до 2000 профилей вместо 600, откликов стало 270 вместо 90 — втрое больше! Но до интервью дошло 10 человек вместо 9. Что это значит?',
  pre:`<table>
  <tr><th></th><th>Профили</th><th>Отклики</th><th>Скрининг</th><th>Интервью</th></tr>

 {type:'info', who:'both', label:'HR + Продукт вместе',
  h:'Что именно сломалось',
  body:`<p>Вернись к ставке. Она состояла из двух частей — и сбылась наполовину:</p>

  </table>
  <p>Сломалось то самое слово — <strong>«подходящих»</strong>. Инструмент ловит по формальным ключевым словам, а не по сути роли, и тащит всех подряд.</p>
  <div class="box warn"><div class="bl">И главное — стало хуже</div><p>Задача была — освободить 40 часов. А получилось 270 откликов, которые кто-то должен разобрать. Твоими же руками. Инструмент не сэкономил время, а переложил его с поиска на разгребание.</p></div>

  ok:'Да. Подходящих 29 против 30 — почти то же. А разбирать теперь 70 откликов вместо 270, и перебор 600 профилей делает машина. Вот теперь те самые 40 часов и освободились — гипотеза сбылась.',
  no:'Не совсем. Смотри на то, ради чего всё затевалось: подходящих столько же (29 против 30), а разгребать теперь 70 откликов вместо 270, и профили перебирает машина. Часы освободились — значит сработало.'},
 {type:'info', who:'pm', label:'Продуктовая механика',
  h:'Продукт стал полезным, когда стал точнее — а не больше',
  body:`<p>Смотри, что произошло. Первый запуск <strong>не был провалом</strong> — он был первым витком. Ты узнаёшь, какое предположение неверно, сужаешь ставку и перепроверяешь. Дёшево: одна вакансия, одна неделя.</p>

},

  no:'Крайности мимо. Ретаргет вернёт какую-то часть — не всех и не «вообще нет». Но вернувшиеся упрутся в ту же стену: продукт так и не довёл до пользы, и они уйдут снова. Пока не починен продукт, это второй платёж за тот же отвал.'},
 {type:'info', who:'both', label:'Маркетинг + Продукт вместе',
  h:'Где рычаг рекламы, а где рычаг продукта',
  body:`<p>Реклама приводит и обещает. Продукт должен доставить обещанное — внутри. Если не доставляет, реклама не спасёт, только быстрее сожжёт бюджет.</p>

 {type:'quiz', who:'pm', label:'Продуктовая механика',

  ok:'Да. Активация — полезный сигнал, но сама по себе обманывает: к первому действию можно протолкнуть и тех, кому продукт не нужен, — а они уйдут. Итог ловит удержание. Смотришь на обе, веришь удержанию.',
  no:'Смотреть на что-то одно — ловушка. Активация без удержания — пустой рост (протолкнули к действию, а ушли). CAC — вообще про привлечение, а мы чиним продукт. Верно — обе метрики, но арбитр удержание: оно ловит реальную пользу.'},
 {type:'info', who:'both', label:'Маркетинг + Продукт вместе',
  h:'Всё это — деньги',
  body:`<p>В маркетинге пользу считают через <strong>CAC</strong> (стоимость привлечения) и <strong>ROAS</strong> (отдачу на рекламу). Но всё это обнуляет или окупает <strong>LTV</strong> — сколько пользователь принесёт, если останется. Дешёвый лид, ушедший через день, — убыток. Удержанный дороже привлечённого.</p>
  <p>В продукте логика та же: сначала сделать так, чтобы оставались, потом лить трафик. Иначе масштабируешь дырявое ведро.</p>
  <div class="box ins"><div class="bl">И вот тут growth</div><p>Привлечение и удержание вместе — это связка growth-продакта, которой нет у обычного джуна-PM. Маркетинговый опыт здесь не «непрофильное прошлое», а половина суперсилы.</p></div>`},
 {type:'info', who:'pm', label:'Продуктовая механика',
  h:'Придумать — половина дела',

  <p>Реальность: один разработчик, два месяца. А задумано: направляемый первый шаг, подсказки, welcome-серия, дашборд активации, персонализация онбординга.</p>
  <div class="box ins"><div class="bl">Ты не кодишь — ты выбираешь</div><p>Код пишет разработчик. Работа продакта — решить, ЧТО строить и ПОЧЕМУ именно эту фичу, и вести команду: объяснить, зачем она, держать фокус. Программировать уметь не нужно — нужно выбрать и объяснить.</p></div>
  <div class="box warn"><div class="bl">Так не бывает</div><p>Всё сразу не влезет — придётся выбирать, что первым.</p></div>`},

  answer:1,
  ok:'Да. Берём самое дешёвое, что проверяет главную ставку: доведём до первой пользы — останутся? Дашборды и персонализация потом, если ядро сработает.',
  no:'Не совсем. И дашборд, и персонализация — вокруг ставки, а не её проверка (персонализация ещё и дорогая). Бери то, что дёшево и отвечает: доведём до пользы — останутся или нет.'},
 {type:'info', who:'both', label:'Маркетинг + Продукт вместе',
  h:'Это называется приоритизация',
  body:`<p>Выбрать одно и отрезать остальное — это <strong>приоритизация</strong>, а первый маленький кусок, который проверяет идею, — <strong>MVP</strong>. Не «урезанная версия», а самый дешёвый способ проверить.</p>
  <div class="box tool"><div class="bl">Тот же навык из маркетинга</div><p>Когда бюджет режут, а план — нет, решают, на какие кампании и аудитории тратить, а какие выключить. Это и есть приоритизация — «перераспределить бюджет». В продукте тем же движением выбираешь, что строить.</p></div>`},

  h:'Перед запуском — сформулируй ставку',

 {type:'quiz', who:'pm', label:'Аналитика',
  h:'Запустили направляемый первый шаг на A/B против контрольной группы, выборка большая. Активаций стало 1300 вместо 700 — почти вдвое! А через месяц осталось 100 вместо 90. Что это значит?',

  answer:1,
  ok:'Да. Активаций +600, а осталось всего на 10 больше. Шаг «регистрация → активация» починили, а «активация → удержание» стоит на месте. Протолкнули больше людей к действию, но не к пользе — и они всё равно ушли.',

 {type:'info', who:'both', label:'Маркетинг + Продукт вместе',

  answer:1,
  ok:'Да. Активаций 650 против 700 — почти то же, зато через месяц осталось 150 вместо 90, в 1,5 раза больше. Доходят те, кто получил пользу, и они остаются. Сезонность отпадает — сравнивали с контрольной группой в тот же период.',
  no:'Смотри, ради чего всё было: удержание 90 → 150. Активаций чуть меньше, но остаются те, кто получил пользу. И это не сезонность — был контроль, тот же месяц. Значит сработало.'},
 {type:'info', who:'pm', label:'Продуктовая механика',
  h:'Продукт вырос, когда сменили рычаг — с рекламы на сам продукт',
  body:`<p>Смотри, что произошло. Привлечение было идеальным и не двигало рост, потому что дыра была после клика. Рычаг сменили: перестали крутить объявление, поменяли сам продукт. Первый заход не был провалом — это был первый виток.</p>
  <div class="box ins"><div class="bl">Вот это и есть работа продакта</div><p>Не сообщение о вещи, а сама вещь. И цикл: <b>гипотеза → проверка → уточнение → снова проверка</b>.</p></div>
  <div class="box tool"><div class="bl">Знакомый ход</div><p>Когда кампания не окупается, её не заливают бюджетом наугад — сужают и пробуют снова. Тот же цикл, только рычаг теперь продукт, а не креатив.</p></div>`}
 ],

},

  no:'Рано действовать. «Переделать онбординг» — уже решение, а мы ещё не знаем, там ли проблема. Больше трафика тоже не диагностирует. Сначала найди обрыв и гипотезу — данными, воронкой, дашбордом.'},
 {type:'info', who:'pm', label:'Аналитик и продакт',
  h:'Что к твоей работе добавляет продакт',

  <div class="box ins"><div class="bl">Ты уже на полпути</div><p>Ты находишь <b>ГДЕ</b>. Продакт добавляет <b>ПОЧЕМУ</b> и <b>ЧТО ДЕЛАТЬ</b>. Это не «дорасти до продакта», а добрать два хода к тому, что ты уже делаешь.</p></div>`},

  <div class="box ins"><div class="bl">Из точки — в гипотезу почему</div><p>Экран «подключить карту» просит доступ к банку <strong>до</strong> того, как человек увидел пользу. Гипотеза: бросают не потому, что не поняли продукт, а потому что отдавать доступ к карте страшно раньше, чем ясно зачем.</p></div>`},
 {type:'quiz', who:'pm', label:'Продуктовая механика',
  h:'Идея: инструмент ловит момент, когда пользователь застрял на экране «подключить карту», и помогает пройти его. Где он играет в воронке?',
  opts:['На обрыве онбординг → первый отчёт — там, где теряем половину','В самом конце, на удержании к 30-му дню','На регистрации, в самом верху'],
  answer:0,
  ok:'Да. Он работает на том обрыве, что ты нашёл: доводит застрявших до первого отчёта. Бьёт по конкретной точке, а не «по retention вообще».',
  no:'Не совсем. Инструмент помогает застрявшим на «подключить карту» — значит играет на обрыве онбординг → первый отчёт, где и теряем половину. Конец воронки — уже следствие.'},
 {type:'info', who:'both', label:'Аналитика + Продукт вместе',
  h:'Где заканчивается инструмент и начинается ценность',
  body:`<p>Инструмент помогает пройти экран. Но остаётся человек не из-за подсказки, а потому что <strong>увидел пользу</strong> — понял, куда уходят деньги. Подсказками нельзя удержать в бесполезном продукте — это <strong>не автоматизируется</strong>.</p>
  <div class="box tool"><div class="bl">Твой ход</div><p>Ты проводишь границу: пройти экран можно подсказать, а желание остаться — нет. Это продуктовое решение о границах — одно из самых взрослых, что делает PM.</p></div>
  <p>Автоматизация окупается там, где много рутины. Ловить застревание и помочь пройти шаг — рутина, её не жалко машине. Сделать продукт ценным, чтобы захотелось вернуться, — не рутина, отдать нельзя.</p>
  <div class="box warn"><div class="bl">Граница честности</div><p>«Подсказки сами удержат» — не бывает. Инструмент доводит до действия, а не создаёт смысл возвращаться.</p></div>`},
 {type:'quiz', who:'pm', label:'Продуктовая механика',
  h:'Инструмент помогает пройти экран. На что смотреть, чтобы понять, что он реально помог удержанию?',
  opts:['Сколько прошли экран «подключить карту»','Сколько осталось через месяц','Сколько кликнули по подсказке'],
  answer:1,
  ok:'Да. Инструмент запускали ради удержания — по нему и меряем: сколько осталось. Прохождение экрана — важный промежуточный шаг, но его подъём ещё не значит, что люди остались (скоро увидишь, как это расходится). Клики по подсказке — vanity.',
  no:'Клики по подсказке — vanity, активность без результата. «Прошли экран» — важный промежуточный шаг, но не цель: протолкнуть можно и тех, кто потом уйдёт. Цель — удержание, по нему и меряем: сколько осталось через месяц.'},
 {type:'info', who:'both', label:'Аналитика + Продукт вместе',
  h:'Всё это — деньги, и в твоём мире тоже',
  body:`<p>В аналитике польза считается так: <strong>retention</strong> (удержание — доля вернувшихся спустя время) ведёт к <strong>LTV</strong> (сколько принесёт оставшийся), плюс стоимость возврата ушедшего. Поднять долю дошедших до пользы — это прямые деньги продукта.</p>
  <p>В продукте логика та же: удержанный пользователь дороже привлечённого, потому что привлечение уже оплачено, а он ещё и возвращается.</p>
  <div class="box ins"><div class="bl">И вот тут product analytics</div><p>Инструмент на данных, где ты читаешь поведение пользователя изнутри, — этого нет у обычного джуна-PM. Аналитический опыт здесь не «непрофильное прошлое», а преимущество.</p></div>`},
 {type:'info', who:'pm', label:'Продуктовая механика',
  h:'Придумать — половина дела',
  body:`<p>Идея есть. Дальше начинается вторая работа продакта — <strong>деливери</strong>: решить, что именно делаем, в каком порядке, и что честно отрезаем.</p>
  <p>Реальность: у тебя <strong>один разработчик и два месяца</strong>. А задумано было: детект застревания, подсказки, A/B-платформа, дашборд по всем шагам, ML-предсказание оттока.</p>
  <div class="box ins"><div class="bl">Ты не кодишь — ты выбираешь</div><p>Код пишет разработчик. Работа продакта — решить, ЧТО строить и ПОЧЕМУ именно эту фичу, и вести команду: объяснить, зачем она, держать фокус. Программировать уметь не нужно — нужно выбрать и объяснить.</p></div>
  <div class="box warn"><div class="bl">Так не бывает</div><p>Всё сразу не влезет — надо выбирать, что первым.</p></div>`},
 {type:'quiz', who:'pm', label:'Продуктовая механика',
  h:'Один разработчик, два месяца. Что берёшь первым?',
  opts:['Дашборд по всем шагам — сначала увидеть всю картину','Детект застревания на «подключить карту» + одна подсказка','ML-модель предсказания оттока — она самая умная'],
  answer:1,
  ok:'Да. Берём самое дешёвое, что проверяет главную ставку: доводит подсказка застрявших или нет. Дашборд и ML — потом, если ядро сработает.',
  no:'И дашборд по всему, и ML — дорого и мимо главной ставки. Дашборд покажет картину, но не проверит, помогает ли подсказка. ML — про предсказание, а не про этот шаг. Бери то, что дёшево и отвечает «доводит или нет».'},
 {type:'info', who:'both', label:'Аналитика + Продукт вместе',
  h:'Это называется приоритизация',
  body:`<p>Выбрать одно и отрезать остальное — это <strong>приоритизация</strong>, а первый маленький кусок, который проверяет идею, — <strong>MVP</strong>. Не «урезанная версия», а самый дешёвый способ проверить.</p>
  <div class="box tool"><div class="bl">Тот же навык из аналитики</div><p>Когда прилетает десять запросов на отчёты, решаешь, какой посчитать первым, а какие подождут. Это она и есть — приоритизация. В аналитике это «разобрать бэклог задач».</p></div>`},
 {type:'info', who:'pm', label:'Продуктовая механика',
  h:'Перед запуском — сформулируй ставку',
  body:`<p>Прежде чем строить, продакт вслух проговаривает, на что ставит. Не «сделаем и посмотрим», а <strong>гипотеза</strong> — проверяемая ставка с числом:</p>
  <div class="box ins"><div class="bl">Твоя гипотеза</div><p><b>Если</b> помогать пройти «подключить карту» в момент застревания,<br><b>то</b> из застрявших через месяц останется заметно больше — не 400, а хотя бы 520 (в 1,3 раза),<br><b>потому что</b> сейчас они бросают, не поняв, что делать дальше.</p></div>
  <div class="box warn"><div class="bl">Слово-предположение</div><p>Здесь всё держится на «не поняв, что делать». Ставка в том, что причина отвала — непонимание шага, а не страх отдать доступ к карте раньше, чем ясно зачем. Обычно ломается оно.</p></div>`},
 {type:'quiz', who:'pm', label:'Аналитика',
  h:'Запустили на A/B против контроля, выборка большая. Экран «подключить карту» прошло 4200 вместо 3000 — на 1200 больше! А через месяц осталось 420 вместо 400. Что это значит?',
  pre:`<table>
  <tr><th></th><th>Онбординг</th><th>Прошли экран</th><th>Через месяц</th></tr>
  <tr><td>было</td><td>6000</td><td>3000</td><td>400</td></tr>
  <tr class="hot"><td>стало</td><td>6000</td><td>4200</td><td>420</td></tr>
  </table>`,
  opts:['Отлично — экран прошло намного больше, инструмент работает','Экран стали проходить, а удерживаться — нет: до отчёта дошло больше, а до пользы так и нет','Может, повезло — подождём ещё месяц'],
  answer:1,
  ok:'Да. Прошедших экран +1200, а осталось всего на 20 больше. Шаг «пройти экран» починили, а «остаться» — стоит. Протолкнули людей дальше, но повода вернуться не дали, и они всё равно ушли. Выборка большая, контроль есть — эффект реальный, но однобокий.',
  no:'Это не удача и не победа. A/B с контролем, выборка большая — эффект настоящий, но кривой: экран проходят на 1200 больше, а удержание +20. Второй шаг подняли, третий стоит. До пользы так и не доводим.'},
 {type:'info', who:'both', label:'Аналитика + Продукт вместе',
  h:'Что именно сломалось',
  body:`<p>Вернись к ставке. Она состояла из двух частей — и сбылась наполовину:</p>
  <table>
  <tr><th>Часть гипотезы</th><th>Итог</th></tr>
  <tr><td>Подсказка объяснит <b>как</b> → экран пройдут</td><td>✅ сбылось: 3000 → 4200</td></tr>
  <tr class="hot"><td>Это <b>удержит</b> → останутся через месяц</td><td>❌ не сбылось: 400 → 420</td></tr>
  </table>
  <p>Сломалось предположение <strong>«не поняли, что делать»</strong>. Настоящая причина была не «не понял как», а <strong>«боязно отдать карту, пока не ясно зачем»</strong>. Подсказка провела через шаг, но пользу вперёд не показала.</p>
  <div class="box warn"><div class="bl">И главное — не стало лучше</div><p>Задача была — поднять удержание. А получилось больше прошедших экран и почти те же 400 оставшихся. Инструмент протолкнул людей глубже, но повода вернуться не создал.</p></div>
  <div class="box tool"><div class="bl">Что делает продакт дальше</div><p>Инструмент не выбрасывает. Меняет суть подсказки и перепроверяет дёшево — один шаг, одна неделя. Новая гипотеза: показать пользу до подключения — например, демо-отчёт на примере, — тогда карту дадут те, кто увидел зачем.</p></div>`},
 {type:'quiz', who:'both', label:'Аналитика + Продукт вместе',
  h:'Показываешь пользу до подключения: демо-отчёт на примере, и только потом просишь карту. Тот же A/B, та же выборка. Экран стало проходить МЕНЬШЕ:',
  pre:`<table>
  <tr><th>Версия</th><th>Прошли экран</th><th>Через месяц</th></tr>
  <tr><td>до инструмента</td><td>3000</td><td>400</td></tr>
  <tr><td>подсказка «как пройти»</td><td>4200</td><td>420</td></tr>
  <tr class="hot"><td>показали пользу до карты</td><td>2800</td><td>520</td></tr>
  </table><p>Экран проходит меньше, чем вообще без инструмента. Успех или провал?</p>`,
  opts:['Провал — экран проходит меньше, чем до инструмента','Успех — удержание выросло с 400 до 520: карту дают те, кто увидел пользу','Пока непонятно — мог быть сезонный скачок'],
  answer:1,
  ok:'Да. Экран прошло 2800 против 3000 — почти то же, зато через месяц осталось 520 вместо 400, в 1,3 раза больше. Карту дают те, кто увидел пользу, и они остаются. Сезонность отпадает — был контроль в тот же период.',
  no:'Смотри, ради чего всё было: удержание 400 → 520. Экран проходит чуть меньше, но остаются те, кто увидел пользу. И это не сезон — сравнивали с контролем. Значит сработало.'},
 {type:'info', who:'pm', label:'Продуктовая механика',
  h:'Продукт стал полезным, когда стал точнее — а не больше',
  body:`<p>Смотри, что произошло. Первый запуск <strong>не был провалом</strong> — он был первым витком. Ты узнаёшь, какое предположение неверно, меняешь подход и перепроверяешь. Дёшево: один шаг, одна неделя.</p>
  <div class="box ins"><div class="bl">Вот это и есть работа продакта</div><p>Не «придумал → сделал → сдал», а цикл: <b>гипотеза → проверка → уточнение → снова проверка</b>. И весь путь ты проходишь от «вот где обрыв» до «вот что с ним делать» — то, что добавляется к твоему «где».</p></div>
  <div class="box tool"><div class="bl">Знакомый ход</div><p>Когда метрика падает, ты не строишь ещё десять графиков наугад. Выдвигаешь гипотезу почему и проверяешь. Тот же цикл — просто теперь ты ещё и решаешь, что делать.</p></div>`}
 ],
 recap:`<div class="h">Пройден полный цикл</div>
  <div><b>Дискавери:</b> отсекаешь ложные версии и находишь точку — «вот этот экран», а не «retention вообще»</div>
  <div><b>Деливери:</b> выбираешь, что делать первым, и честно отрезаешь лишнее</div>
  <div><b>Проверка:</b> гипотеза с числом, и видно, какое предположение сломалось</div>
  <div>Добираешь к своему «где» ещё «почему» и «что делать»</div>
  <div><b>Второй виток:</b> показал пользу до подключения — и удержание выросло</div>
  <div class="h">Навыки из аналитики, которые работают и здесь</div>
  <div class="sk">Режешь данные по срезам, пока не найдёшь причину → это <b>дискавери</b></div>
  <div class="sk">Разбираешь бэклог запросов на отчёты → это <b>приоритизация</b></div>
  <div class="sk">Знаешь, что «клики по подсказке» ничего не значат → отличаешь <b>vanity-метрику</b></div>
  <div class="sk">Читаешь A/B и не путаешь эффект с сезонностью → это <b>работа с данными</b></div>`,
 niche:`<div class="bl">Куда с этим идти</div><p>Product analytics и data-продукты. Там опыт с данными — не «непрофильное прошлое», а преимущество: ты читаешь поведение пользователя изнутри, чего нет у обычного джуна-PM.</p>`
},

 2  подняли бизнес-цифру</div>

  answer:0,
  ok:'Верно. 80% в срок — машина везёт исправно. Вопрос не «быстрее ли едем», а «то ли грузим». Сравнишь две сработавшие фичи с десятью пустыми — там и увидишь, где сломан отбор.',
  no:'И «спланировать плотнее», и «выкатывать чаще» — про скорость. А скорость у тебя уже отличная, 80% в срок. Стоит результат: из выпущенного почти ничто не двигает цифру. Начать стоит оттуда — чем 2 сработавшие фичи отличались от 10 пустых.'},
 {type:'info', who:'pm', label:'Зачем вообще продакты',
  h:'Деливери ты умеешь. Тогда зачем нужны продакты?',
  body:`<p>Довозить в срок, держать скоуп, разруливать зависимости — ты это умеешь, и умеют немногие. Учить тебя этому не нужно.</p>
  <p>Но вот факт: ты всё довёл в срок, а бизнес не вырос. Значит одного делать-в-срок мало. Тогда зачем вообще нужны продакты?</p>
  <p>Ответ простой. К сроку и скоупу продакт добавляет ещё один вопрос и держит его всё время: <strong>идёт ли импакт</strong> — растёт ли та цифра, ради которой всё затевали. И если не растёт — меняет курс, не дожидаясь финала.</p>
  <div class="box ins"><div class="bl">Что добираем</div><p>Импакт — рост целевой цифры (выручки, удержания, чего вы хотели поднять). Твоя задача здесь — добрать один вопрос: не «успеем ли», а «а оно вообще двигает цель». Первый у тебя уже на автомате, поверх него ложится второй.</p></div>`},
 {type:'info', who:'pm', label:'Продуктовая механика',
  h:'А в скорости ли дело?',
  body:`<table>

  <tr class="hot"><td>Фич, поднявших цифру (hit-rate)</td><td>2 из 12</td><td>17%</td></tr>
  </table>
  <p><strong>hit-rate</strong> — доля выпущенных фич, что реально сдвинули метрику. У тебя 17%: из 12 вышедших в цель попали две. Десять отработали в срок и вхолостую.</p>
  <p>Скорость в норме. Значит дело не в том, как быстро делаете, а в том, что выбираете. Фичи брали по громкости — кто настойчивее просил, ту и ставили.</p>
  <div class="box ins"><div class="bl">Открытие</div><p>Дорого не «не успеть». Дорого — успеть сделать то, что не двигает цель. В каждую холостую фичу уложены недели команды.</p></div>`},

let activeCase=null, STEPS=[], i=0, answers={}, totalQuiz=0;
const app=document.getElementById('app');
const noteEl=document.getElementById('note');
const topbar=document.getElementById('topbar');
const correctCount = () => STEPS.reduce((n,s,idx)=> n + (s.type==='quiz' && answers[idx]===s.answer ? 1 : 0), 0);

function goHome(){
  activeCase=null; i=0; answers={};
  topbar.style.display='none';
  noteEl.innerHTML='Один кейс — один твой знакомый процесс, показанный как продуктовая работа.';
  try{ if(TG&&TG.BackButton) TG.BackButton.hide(); }catch(e){}
  const cards=Object.keys(CASES).map(key=>{
    const c=CASES[key];
    return `<button class="pick" onclick="startCase('${key}')">
      <span class="em">${c.em}</span>
      <span class="tt"><span class="nm">${c.name}</span><span class="tg">${c.tag}</span></span>
      <span class="ar">→</span></button>`;
  }).join('');
  app.innerHTML=`<div class="home">
    <h1>Поймёшь, чем занимается продакт — <span class="g">на языке своей профессии</span></h1>
    <p>Никаких лекций. Берём процесс, который ты и так знаешь каждый день, и показываем: это и есть продуктовая работа.</p>
    <div class="pick-q">Кем ты работаешь?</div>
    <div style="font-size:12.5px;color:var(--mute);margin:-4px 0 14px;line-height:1.45">Слева — твоя профессия, справа — продуктовая роль, где твой опыт даёт фору.</div>
    <div class="picks">${cards}<button class="pick pick-other" onclick="otherProf()">
      <span class="em">✍️</span>
      <span class="tt"><span class="nm">У меня другая профессия</span><span class="tg">скажи какая — сделаем кейс под тебя</span></span>
      <span class="ar">→</span></button></div>
    <div class="fine">Кейс собран командой: профильный консультант — реалии профессии · продуктовый эксперт — механика</div>
  </div>`;
  window.scrollTo(0,0);
}

function otherProf(){
  haptic('light');
  topbar.style.display='none';
  app.innerHTML=`<div class="home">
    <h1>Сделаем кейс <span class="g">под твою профессию</span></h1>
    <p>Мы собираем кейсы под конкретные профессии. Напиши свою — если наберётся спрос, соберём и её.</p>
    <div class="pick-q">По какой специальности хочешь в продакты?</div>
    <input class="other-in" id="otherIn" placeholder="например: юрист, дизайнер, врач, HR…" autocomplete="off">
    <button class="btn" onclick="submitOther()">Отправить</button>
    <button class="btn2" onclick="goHome()">Назад к списку</button>
  </div>`;
  try{ document.getElementById('otherIn').focus(); }catch(e){}
  window.scrollTo(0,0);
}
function submitOther(){
  const el=document.getElementById('otherIn'); const v=(el&&el.value||'').trim();
  if(!v){ try{ el.focus(); }catch(e){} return; }
  haptic('ok');
  track('other_profession',{text:v});
  app.innerHTML=`<div class="home" style="justify-content:center;text-align:center">
    <div style="font-size:56px">🙏</div>
    <h1 style="text-align:center">Записал: <span class="g">${v.replace(/</g,'&lt;')}</span></h1>
    <p style="text-align:center">Спасибо. Смотрим, на какие профессии наберётся спрос, — и собираем следующими</p>
    <button class="btn2" onclick="goHome()">Назад к списку</button>
  </div>`;
  window.scrollTo(0,0);
}

function startCase(key){
  haptic('light');
  track('case_start',{profession:key});
  activeCase=key;
  STEPS=CASES[key].steps.concat([{type:'done'}]);
  totalQuiz=STEPS.filter(s=>s.type==='quiz').length;
  i=0; answers={};
  topbar.style.display='flex';
  noteEl.innerHTML='Кейс собран в паре: '+CASES[key].credit;
  render();
}

function back(){
  if(activeCase===null) return;
  if(i>0){ i--; render(); }
  else { goHome(); }
}

function render(){
  const s=STEPS[i], C=CASES[activeCase];
  if(s.type!=='done') track('step_view',{profession:activeCase, step:i});
  document.getElementById('fill').style.width=(i/(STEPS.length-1)*100)+'%';
  document.getElementById('stepN').textContent = s.type==='done'?'✓':`${i+1}/${STEPS.length-1}`;
  try{ if(TG&&TG.BackButton) TG.BackButton.show(); }catch(e){}

  if(s.type==='done'){
    track('case_complete',{profession:activeCase, correct:correctCount(), total:totalQuiz});
    app.innerHTML=`<div class="done"><div class="big">🎉</div>
      <h2>Кейс пройден</h2><p>Правильных ответов: ${correctCount()} из ${totalQuiz}</p>
      <div class="ddv-final"><div class="t">Вот и весь продакт:<br><b>Дискавери → Деливери → Проверка</b><br>Понять что делать · сделать · убедиться, что попали</div></div>
      <div class="survey" id="survey">
        <div class="sv-goal">
          <div class="lbl">твоя цель в продукте</div>
          <div class="role">${C.goal.role}</div>
          <div class="why">${C.goal.why}</div>
        </div>
        <div class="sv-q">Пойдёшь учиться на продакта — по-настоящему, на кейсах своей профессии?</div>
        <div class="sv-cta">
          <button class="btn ok" onclick="surveyYes()">Да, интересно</button>
          <button class="btn2" onclick="surveyNo()">Пока нет</button>
        </div>
      </div>
      <button class="btn2" onclick="startCase('${activeCase}')">Пройти заново</button>
      <button class="btn2" onclick="goHome()">Другая профессия</button></div>`;
    window.scrollTo(0,0);
    return;
  }

  if(s.type==='info'){
    app.innerHTML=`<div class="stage">
      <span class="who ${s.who}">${s.label}</span>
      <h2>${s.h}</h2>${s.body}
      <div class="foot"><button class="btn" onclick="next()">Продолжить</button></div></div>`;
  } else {
    const prev=answers[i], done=prev!==undefined, ok=done&&prev===s.answer;
    app.innerHTML=`<div class="stage">
      <span class="who ${s.who}">${s.label}</span>
      <h2>${s.h}</h2>${s.pre||''}
      <div class="opts" id="opts">${s.opts.map((o,k)=>{
        let cls=''; if(done){ if(k===s.answer)cls=' right'; else if(k===prev)cls=' wrong'; }
        return `<button class="opt${cls}" ${done?'style="pointer-events:none"':''} onclick="pick(${k})"><span class="k">${String.fromCharCode(65+k)}</span><span>${o}</span></button>`;
      }).join('')}</div>
      <div class="foot">
        <div class="verdict ${done?'show '+(ok?'ok':'no'):''}" id="v">${done?(ok?'✓ '+s.ok:'💡 '+s.no):''}</div>
        <button class="btn ${done&&ok?'ok':''}" id="nb" ${done?'':'disabled'} onclick="next()">${done?'Дальше':'Проверить'}</button></div></div>`;
  }
  window.scrollTo(0,0);
}
function pick(k){
  if(answers[i]!==undefined) return;
  answers[i]=k;
  const s=STEPS[i], ok=k===s.answer;
  haptic(ok?'ok':'no');
  document.querySelectorAll('#opts .opt').forEach((o,x)=>{o.style.pointerEvents='none';
    if(x===s.answer)o.classList.add('right'); if(x===k&&!ok)o.classList.add('wrong');});
  const v=document.getElementById('v');
  v.className='verdict show '+(ok?'ok':'no');
  v.innerHTML=(ok?'✓ ':'💡 ')+(ok?s.ok:s.no);
  const b=document.getElementById('nb'); b.disabled=false; b.textContent='Дальше'; if(ok)b.classList.add('ok');
}
function next(){ haptic('light'); i++; render(); }

function surveyYes(){
  haptic('ok'); const g=CASES[activeCase].goal;
  track('fakedoor_yes',{profession:activeCase});
  const el=document.getElementById('survey'); if(el) el.innerHTML=`
    <div class="sv-done"><span class="em">🔥</span>Огонь, формат зашёл</div>
    <div class="sv-note" style="text-align:center">Полный курс — весь путь в <b>${g.role}</b> на кейсах твоей профессии — уже собираем. Ты в списке первых</div>`;
}
function surveyNo(){
  haptic('light'); track('survey_no',{profession:activeCase});
  const el=document.getElementById('survey'); if(el) el.innerHTML=`
    <div class="sv-q">Честно, что не так?</div>
    <div class="sv-opts">
      <button class="sv-o" onclick="surveyReason('nothing_new')">Интересно, но ничего нового не узнал</button>
      <button class="sv-o" onclick="surveyReason('hard')">Много непонятного</button>
      <button class="sv-o" onclick="surveyReason('boring')">Всё понятно, но не цепляет</button>
      <button class="sv-o" onclick="surveyReason('no_value')">Не увидел пользы лично для себя</button>
      <button class="sv-o" onclick="surveyReason('mismatch')">Не совпало с моей профессией</button>
    </div>`;
}
function surveyReason(r){
  haptic('light'); track('survey_reason',{profession:activeCase, reason:r});
  const el=document.getElementById('survey'); if(el) el.innerHTML=`<div class="sv-done" style="font-size:15px">Спасибо, записал 🙏<br>По таким ответам и правим</div>`;
}

goHome();
track('app_open');
</script>
</body>
</html>
